apiVersion: v1
kind: Service
metadata:
  name: auth-gateway
  namespace: auth-gateway
  labels:
    app: auth-gateway
spec:
  type: NodePort
  # Preserve the caller IP so /internal/clients can reject public direct NodePort traffic.
  externalTrafficPolicy: Local
  selector:
    app: auth-gateway
  ports:
    - name: http
      port: 8090
      targetPort: http
      nodePort: 31091
