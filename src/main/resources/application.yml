server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: auth-gateway
  profiles:
    active: dev
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${AUTH_DB_USERNAME:auth}
    password: ${AUTH_DB_PASSWORD:auth_dev_password}

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

jwks:
  active-kid: ${JWKS_ACTIVE_KID:auth-active}
  previous-kid: ${JWKS_PREVIOUS_KID:auth-previous}
  key-store:
    active-private-key: ${JWKS_ACTIVE_PRIVATE_KEY_PATH:config/keys/auth-active.pem}
    previous-private-key: ${JWKS_PREVIOUS_PRIVATE_KEY_PATH:config/keys/auth-previous.pem}

auth:
  issuer: ${AUTH_ISSUER:https://auth.careermate.cn}
  token-endpoint-audience: ${AUTH_TOKEN_ENDPOINT_AUDIENCE:https://auth.careermate.cn/oauth/token}
  access-token-ttl-seconds: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:900}
  refresh-token-ttl-seconds: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:604800}
  # 勾选"记住我"时 refresh token TTL（默认 30 天，滑动窗口）
  remember-refresh-ttl-seconds: ${AUTH_REMEMBER_REFRESH_TTL_SECONDS:2592000}
  # 旋转宽限期：窗口内旧 refresh token 复用视作并发双刷补发令牌，0=严格一次性
  refresh-rotation-grace-seconds: ${AUTH_REFRESH_ROTATION_GRACE_SECONDS:60}
  exchange-token-ttl-seconds: ${AUTH_EXCHANGE_TOKEN_TTL_SECONDS:600}
  events:
    dev-allow-empty-secret: false
    subscriptions:
      ragforge:
        endpoint: ${AUTH_RAGFORGE_EVENT_ENDPOINT:}
        hmac-secret: ${AUTH_RAGFORGE_EVENT_HMAC_SECRET:}
      careermate:
        endpoint: ${AUTH_CAREERMATE_EVENT_ENDPOINT:}
        hmac-secret: ${AUTH_CAREERMATE_EVENT_HMAC_SECRET:}
  sms:
    storage: memory
    phone-hash-pepper: ${AUTH_SMS_PHONE_HASH_PEPPER:auth-gateway-dev-pepper}
    code-ttl-seconds: 300
    mock-code: "123456"
    # 发送侧限流（防短信轰炸）。可经环境变量在生产覆盖，无需重发版调优。
    phone-day-send-limit: ${AUTH_SMS_PHONE_DAY_SEND_LIMIT:5}
    ip-minute-send-limit: ${AUTH_SMS_IP_MINUTE_SEND_LIMIT:10}
    ip-day-send-limit: ${AUTH_SMS_IP_DAY_SEND_LIMIT:100}
    send-cooldown-seconds: ${AUTH_SMS_SEND_COOLDOWN_SECONDS:60}
